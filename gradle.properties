# Mod Information
mod_version = 0.2.0
root_package = sircow.roomfortwo
mod_id = roomfortwo
mod_name = Room For Two
mod_description = Lets you share a bed with another player.
mod_url = https://github.com/Sir-Cow/room-for-two
mod_update_json = https://api.modrinth.com/updates/YZlvzIFq/forge_updates.json
mod_authors = Sir_Cow
mod_credits = Contributors: ChaosTheLegend, LokiLeiche
mod_logo_path = assets/icon.png

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = true
mixin_booter_version = 10.7
generate_mixins_json = true
mixin_configs = ${mod_id}
mixin_refmap = mixins.${mod_id}.refmap.json
mixin_package = sircow.roomfortwo.mixin

# Coremods
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = sircow.roomfortwo.core.RoomForTwoLoadingPlugin

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

# Source Options
use_modern_java_syntax = false
use_jetbrains_annotations = true

generate_sources_jar = true
generate_javadocs_jar = false

# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false
org.gradle.configuration-cache=false