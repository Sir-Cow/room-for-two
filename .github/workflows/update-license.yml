name: Update License Year

on:
  schedule:
    # Runs at 00:00 on January 1st every year
    - cron: '0 0 1 1 *'
  workflow_dispatch:

jobs:
  update-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Update License Year
        run: |
          CURRENT_YEAR=$(date +%Y)
          LICENSE_FILE="LICENSE"

          if [ ! -f "$LICENSE_FILE" ]; then
            echo "Error: $LICENSE_FILE not found."
            exit 1
          fi

          sed -i -E "s/([0-9]{4})(-[0-9]{4})?/$CURRENT_YEAR/g" "$LICENSE_FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add LICENSE
          
          # Only commit and push if changes exist
          if ! git diff --cached --quiet; then
            git commit -m "chore: update license year"
            git push
          else
            echo "License year is already up to date."
          fi